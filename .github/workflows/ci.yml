name: CI

on:
  pull_request:
    branches:
      - integration
      - main
  push:
    branches:
      - integration
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require integration as the production source
        run: |
          if [ "${{ github.head_ref }}" != "integration" ]; then
            echo "Production pull requests must come from integration, not ${{ github.head_ref }}."
            exit 1
          fi

  validate:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run simulation tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: pous-production-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

